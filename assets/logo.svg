<svg xmlns="http://www.w3.org/2000/svg" width="500" height="116" viewBox="0 0 500 116" role="img" aria-labelledby="title desc">
  <title id="title">XR-UCalib Logo</title>
  <desc id="desc">XR-UCalib wordmark in a blue-to-violet gradient.</desc>

  <defs>
    <linearGradient id="wordmark-gradient" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="wordmark-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1D4ED8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <text
    x="250"
    y="87"
    text-anchor="middle"
    font-family="Times New Roman, Nimbus Roman, Liberation Serif, Times, serif"
    font-size="88"
    font-weight="700"
    letter-spacing="-1.2"
    fill="url(#wordmark-gradient)"
    filter="url(#wordmark-shadow)">
    <tspan font-weight="700" letter-spacing="-1.8">XR</tspan><tspan font-weight="400">-</tspan><tspan font-style="italic" letter-spacing="-1.8">UCalib</tspan>
  </text>
</svg>
